<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Storyverse 薪资表</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e4e7ef;--acc:#4f46e5;--accs:#eef0ff;--red:#dc2626;--grn:#059669;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px}.brand small{font-weight:400;color:var(--mute);margin-left:6px}
.sp{margin-left:auto}
main{max-width:1400px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#c7cbe0}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:4px 9px;font-size:12px}.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:34px}
input:focus,textarea:focus{outline:2px solid var(--accs);border-color:var(--acc)}
.hint{color:var(--mute);font-size:12px}
.wrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px}
th{font-size:12px;color:var(--mute);text-align:left;font-weight:600;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
tr.dirty td{background:#fffbeb}
#state{font-size:12px;color:var(--mute)}#state.err{color:var(--red)}#state.ok{color:var(--grn)}
</style></head><body>
<header><div class="bar"><div class="brand">Storyverse 薪资表<small>Payroll · 私密数据</small></div>
<span id="state"></span><div class="sp row" id="tools" hidden>
<button class="btn" id="reload">重新加载</button><button class="btn" id="add">＋ 新增一行</button>
<button class="btn pri" id="save">保存并提交</button><button class="btn sm" id="logout">退出</button></div></div></header>
<main>
<section class="card" id="login" hidden>
<h3 style="margin-top:0">登录</h3>
<p class="hint">本页面不包含任何薪资数据。请粘贴一个只授权 <b>dora11111111/storyverse-hr</b>「Contents: 读写」的 GitHub 细粒度令牌（Fine-grained token）。令牌只保存在本浏览器（localStorage），只发送到 api.github.com。</p>
<div class="row"><input id="tok" type="password" placeholder="github_pat_..." style="max-width:460px"><button class="btn pri" id="go">登录</button></div>
</section>
<section class="card" id="grid" hidden><div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
<p class="hint">保存会把 payroll.csv 提交到私有仓库 storyverse-hr（main 分支）。如果他人已修改，会提示重新加载。</p></section>
</main>
<script>
const OWNER='dora11111111',REPO='storyverse-hr',PATH='payroll.csv',BRANCH='main',LS='sv_payroll_token';
const $=s=>document.querySelector(s);
let header=[],rows=[],sha=null,dirty=false,EOL='\n';
const REQUIRED=[['姓名 Name',/name|姓名/i],['职位 Role',/role|职位|岗位/i],['入职日期 Start date',/start|入职/i],['试用薪资/月 Trial wage (monthly)',/trial wage|试用薪资|probation/i],['全职薪资/月 Full-time wage (monthly)',/full|全职/i],['币种 Currency',/currency|币种/i],['提成比例 Commission %',/commission %|提成比例|rate/i],['提成基数 Commission base',/base|提成基数/i],['备注 Notes',/note|备注/i]];
function state(t,c){const e=$('#state');e.textContent=t;e.className=c||''}
function parseCSV(s){const out=[];let r=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c=='"'){if(s[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&s[i+1]=='\n')i++;r.push(f);out.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);out.push(r)}return out}
const esc=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const toCSV=()=>[header,...rows].map(r=>r.map(esc).join(',')).join(EOL)+EOL;
const b64dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
function b64enc(s){const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode(...u.subarray(i,i+0x8000));return btoa(b)}
async function api(method,body){const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`+(method=='GET'?`?ref=${BRANCH}&t=${Date.now()}`:''),{method,cache:'no-store',headers:{Authorization:'Bearer '+localStorage.getItem(LS),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body&&JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.message||r.status);e.status=r.status;throw e}return j}
async function load(){state('加载中…');try{const j=await api('GET');sha=j.sha;let t=b64dec(j.content).replace(/^\uFEFF/,'');EOL=t.includes('\r\n')?'\r\n':'\n';const all=parseCSV(t).filter(r=>r.some(x=>x.trim()));header=all[0]||[];rows=all.slice(1);
// ensure required columns exist (e.g. add Role after Name)
REQUIRED.forEach(([lab,re],k)=>{if(!header.some(h=>re.test(h))){const at=k==1?1:header.length;header.splice(at,0,lab);rows.forEach(r=>r.splice(at,0,''))}});
rows.forEach(r=>{while(r.length<header.length)r.push('')});dirty=false;render();$('#login').hidden=true;$('#grid').hidden=false;$('#tools').hidden=false;state(`已加载 ${rows.length} 行`,'ok')}
catch(e){state('加载失败：'+e.message,'err');if(e.status==401||e.status==403||e.status==404){$('#login').hidden=false;$('#grid').hidden=true;$('#tools').hidden=true}}}
function render(){$('#th').innerHTML='<tr>'+header.map((h,i)=>`<th><input data-h="${i}" value="${h.replace(/"/g,'&quot;')}" style="font-weight:600;font-size:12px"></th>`).join('')+'<th></th></tr>';
$('#tb').innerHTML='';rows.forEach((r,ri)=>{const tr=document.createElement('tr');header.forEach((h,ci)=>{const td=document.createElement('td');const el=document.createElement(/note|备注|base|基数/i.test(h)?'textarea':'input');el.value=r[ci]||'';if(/date|日期|结束/i.test(h))el.placeholder='YYYY-MM-DD';el.oninput=()=>{r[ci]=el.value;tr.className='dirty';mark()};td.appendChild(el);tr.appendChild(td)});const td=document.createElement('td');const b=document.createElement('button');b.className='btn sm danger';b.textContent='删除';b.onclick=()=>{if(confirm(`删除「${r[0]||'空行'}」？`)){rows.splice(ri,1);mark();render()}};td.appendChild(b);tr.appendChild(td);$('#tb').appendChild(tr)});
document.querySelectorAll('[data-h]').forEach(el=>el.oninput=()=>{header[+el.dataset.h]=el.value;mark()})}
function mark(){dirty=true;state('有未保存的修改')}
async function save(){const msg=prompt('提交说明：','Update payroll via web');if(msg===null)return;$('#save').disabled=true;state('保存中…');try{const j=await api('PUT',{message:msg,content:b64enc('\uFEFF'+toCSV()),sha,branch:BRANCH});sha=j.content.sha;dirty=false;document.querySelectorAll('tr.dirty').forEach(t=>t.className='');state('✓ 已提交 '+new Date().toLocaleTimeString(),'ok')}catch(e){state(e.status==409?'保存失败：文件已被他人修改，请先复制你的修改再重新加载':'保存失败：'+e.message,'err')}$('#save').disabled=false}
$('#go').onclick=()=>{const t=$('#tok').value.trim();if(!t)return;localStorage.setItem(LS,t);$('#tok').value='';load()};
$('#logout').onclick=()=>{localStorage.removeItem(LS);location.reload()};
$('#add').onclick=()=>{rows.push(header.map(()=>''));mark();render();window.scrollTo(0,document.body.scrollHeight)};
$('#save').onclick=save;$('#reload').onclick=()=>{if(!dirty||confirm('放弃未保存的修改？'))load()};
window.onbeforeunload=e=>{if(dirty){e.preventDefault();return''}};
if(localStorage.getItem(LS))load();else{$('#login').hidden=false;state('未登录')}
</script></body></html>
